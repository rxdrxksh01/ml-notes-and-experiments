name: Track Repository Clones

on:
  schedule:
    - cron: '0 0 * * *'   # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual run

permissions:
  contents: write
  actions: read

jobs:
  track-clones:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch clone statistics
        run: |
          mkdir -p analytics

          FILE="analytics/clones.csv"

          # Create file with header if it doesn't exist
          if [ ! -f "$FILE" ]; then
            echo "date,total_clones,unique_cloners" > "$FILE"
          fi

          echo "Fetching GitHub traffic data..."

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/traffic/clones")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
          CLONES_DATA=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "API error: $HTTP_STATUS"
            echo "$CLONES_DATA"
            exit 1
          fi

          # Extract data from JSON
          echo "$CLONES_DATA" | jq -r \
          '.clones[] | "\(.timestamp | split("T")[0]),\(.count),\(.uniques)"' >> "$FILE"

          # Remove duplicates and sort by date
          HEADER="date,total_clones,unique_cloners"

          tail -n +2 "$FILE" | sort -u -t, -k1,1 > analytics/temp.csv

          echo "$HEADER" > "$FILE"
          cat analytics/temp.csv >> "$FILE"

          rm analytics/temp.csv

          echo "Clone data updated."

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add analytics/clones.csv

          if ! git diff --cached --quiet; then
            git commit -m "docs: update historical clone statistics"
            git push
          else
            echo "No changes to commit"
          fi